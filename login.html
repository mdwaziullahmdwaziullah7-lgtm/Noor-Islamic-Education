<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Madrasa Education BD</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f7f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
padding:30px;
border-radius:15px;
width:350px;
box-shadow:0 3px 10px rgba(0,0,0,.2);
}

h2{
text-align:center;
color:#0f6b3e;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:100%;
padding:12px;
background:#0f6b3e;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

a{
display:block;
text-align:center;
margin-top:15px;
}
</style>
</head>
<body>

<div class="box">
<h2>👨‍🎓 Student Login</h2>

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<button>Login</button>

<a href="index.html">🏠 Home</a>
</div>

</body>
</html>
